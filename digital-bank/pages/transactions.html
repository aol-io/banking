<!DOCTYPE html>
<html lang="en">
<head>
<script src="../assets/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Meridian</title>
<meta name="description" content="View and search your Meridian transaction history.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/notifications.css">
<link rel="stylesheet" href="../assets/css/transactions.css">
</head>
<body class="app-body auth-pending">

<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- =========================================================
     LOGGED-IN APP HEADER
     Loaded from components/app-navbar.html by components.js —
     also carries the notification bell ([data-notification-bell])
     and boots the notification center automatically once injected.
     Do not hardcode the header markup here — edit components/app-navbar.html instead.
     ========================================================= -->
<div data-component="app-navbar"></div>

<main id="main-content" class="transactions-main">
  <div class="container">

    <div class="page-head page-head--split">
      <div>
        <h1>Transactions</h1>
        <p>Every payment, transfer, and charge across all your Meridian balances.</p>
      </div>
      <button type="button" class="btn btn-ghost" id="tx-export-btn">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v9M4.5 7.5 8 11l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Export CSV
      </button>
    </div>

    <!-- =========================================================
         SUMMARY STRIP
         ========================================================= -->
    <div class="grid tx-summary-grid" id="tx-summary-grid" aria-live="polite">
      <div class="tx-summary-card">
        <span class="tx-summary-label">Money in — this month</span>
        <span class="tx-summary-value amt pos skeleton" id="tx-summary-in">Loading…</span>
      </div>
      <div class="tx-summary-card">
        <span class="tx-summary-label">Money out — this month</span>
        <span class="tx-summary-value amt skeleton" id="tx-summary-out">Loading…</span>
      </div>
      <div class="tx-summary-card">
        <span class="tx-summary-label">Net change</span>
        <span class="tx-summary-value amt skeleton" id="tx-summary-net">Loading…</span>
      </div>
      <div class="tx-summary-card">
        <span class="tx-summary-label">Pending</span>
        <span class="tx-summary-value skeleton" id="tx-summary-pending">Loading…</span>
      </div>
    </div>

    <!-- =========================================================
         FILTER BAR
         Two layouts live side by side here, toggled purely by CSS
         media query (see transactions.css — not yet updated):
           - .tx-filter-group      -> desktop/tablet, unchanged,
             always visible above the mobile breakpoint.
           - .tx-filter-mobile     -> mobile only. A collapsed
             two-button row (Category left / Status right) plus a
             timeframe chip beneath, each opening its own small
             dropdown/panel instead of showing raw <select>s and
             date inputs all at once.
         The search box (.tx-search) is shared by both — no
         breakpoint-specific version needed.
         ========================================================= -->
    <div class="tx-filter-bar">
      <div class="tx-search">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="m17 17-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <label for="tx-search-input" class="sr-only">Search transactions</label>
        <input type="search" id="tx-search-input" placeholder="Search by description, reference, or amount">
      </div>

      <!-- =========================================================
           NEW — MOBILE COLLAPSED FILTERS
           Category and Status are independent from the desktop
           #tx-filter-type / #tx-filter-status selects below: Category
           here is DIRECTION-based (Debit / Credit / Other), not the
           desktop's transaction-TYPE list, per the redesign. Status
           mirrors the desktop status set plus "Reversed", which the
           desktop select didn't previously offer.

           Each trigger button + its dropdown/panel share a
           position:relative wrapper (.tx-filter-select-wrap) so the
           panel can anchor directly beneath its own button in CSS,
           rather than one shared overlay for both.
           ========================================================= -->
      <div class="tx-filter-mobile" id="tx-filter-mobile">
        <div class="tx-filter-mobile-row">

          <!-- Category (direction) dropdown -->
          <div class="tx-filter-select-wrap">
            <button type="button" class="tx-filter-chip" id="tx-category-btn"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="tx-category-dropdown">
              <span id="tx-category-label">Category</span>
              <svg class="tx-filter-chip-caret" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                <path d="M2.5 3.75 5 6.25l2.5-2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <div class="tx-filter-dropdown" id="tx-category-dropdown" hidden role="listbox" aria-label="Filter by category">
              <button type="button" class="tx-filter-option is-selected" data-category="all" role="option" aria-selected="true">All categories</button>
              <button type="button" class="tx-filter-option" data-category="debit" role="option" aria-selected="false">
                <span class="tx-filter-dot tx-filter-dot--debit" aria-hidden="true"></span>
                Debit <span class="tx-filter-option-sub">Money out</span>
              </button>
              <button type="button" class="tx-filter-option" data-category="credit" role="option" aria-selected="false">
                <span class="tx-filter-dot tx-filter-dot--credit" aria-hidden="true"></span>
                Credit <span class="tx-filter-option-sub">Money in</span>
              </button>
              <button type="button" class="tx-filter-option" data-category="other" role="option" aria-selected="false">
                <span class="tx-filter-dot tx-filter-dot--other" aria-hidden="true"></span>
                Other <span class="tx-filter-option-sub">Fees &amp; adjustments</span>
              </button>
            </div>
          </div>

          <!-- Status dropdown -->
          <div class="tx-filter-select-wrap">
            <button type="button" class="tx-filter-chip" id="tx-status-btn"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="tx-status-dropdown">
              <span id="tx-status-label">Status</span>
              <svg class="tx-filter-chip-caret" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                <path d="M2.5 3.75 5 6.25l2.5-2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <div class="tx-filter-dropdown tx-filter-dropdown--right" id="tx-status-dropdown" hidden role="listbox" aria-label="Filter by status">
              <button type="button" class="tx-filter-option is-selected" data-status="all" role="option" aria-selected="true">All statuses</button>
              <button type="button" class="tx-filter-option" data-status="Completed" role="option" aria-selected="false">Successful</button>
              <button type="button" class="tx-filter-option" data-status="Processing" role="option" aria-selected="false">Pending</button>
              <button type="button" class="tx-filter-option" data-status="Reversed" role="option" aria-selected="false">Reversed</button>
              <button type="button" class="tx-filter-option" data-status="Failed" role="option" aria-selected="false">Failed</button>
            </div>
          </div>
        </div>

        <!-- Timeframe chip — sits beneath the category/status row,
             opens a small panel with presets + a custom range. -->
        <div class="tx-filter-select-wrap tx-filter-select-wrap--timeframe">
          <button type="button" class="tx-filter-timeframe-btn" id="tx-timeframe-btn"
                  aria-haspopup="dialog" aria-expanded="false" aria-controls="tx-timeframe-panel">
            <svg class="tx-filter-timeframe-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2 6.5h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span id="tx-timeframe-label">All time</span>
            <svg class="tx-filter-chip-caret" viewBox="0 0 10 10" fill="none" aria-hidden="true">
              <path d="M2.5 3.75 5 6.25l2.5-2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="tx-filter-timeframe-panel" id="tx-timeframe-panel" hidden role="dialog" aria-modal="true" aria-label="Select time frame">
            <div class="tx-filter-timeframe-presets" role="radiogroup" aria-label="Preset ranges">
              <button type="button" class="tx-filter-preset is-selected" data-range="all">All time</button>
              <button type="button" class="tx-filter-preset" data-range="7d">Last 7 days</button>
              <button type="button" class="tx-filter-preset" data-range="30d">Last 30 days</button>
              <button type="button" class="tx-filter-preset" data-range="month">This month</button>
              <button type="button" class="tx-filter-preset" data-range="custom">Custom range</button>
            </div>

            <div class="tx-filter-timeframe-custom" id="tx-timeframe-custom" hidden>
              <div class="tx-filter-date-row">
                <label for="tx-filter-from-mobile">From</label>
                <input type="date" id="tx-filter-from-mobile">
              </div>
              <div class="tx-filter-date-row">
                <label for="tx-filter-to-mobile">To</label>
                <input type="date" id="tx-filter-to-mobile">
              </div>
            </div>

            <div class="tx-filter-timeframe-actions">
              <button type="button" class="btn btn-ghost btn-sm" id="tx-timeframe-cancel">Cancel</button>
              <button type="button" class="btn btn-primary btn-sm" id="tx-timeframe-apply">Apply</button>
            </div>
          </div>
        </div>

        <button type="button" class="tx-filter-mobile-reset" id="tx-filter-reset-mobile">Reset filters</button>
      </div>

      <!-- =========================================================
           EXISTING DESKTOP/TABLET FILTER GROUP — unchanged.
           Hidden below the mobile breakpoint via CSS once
           transactions.css is updated; .tx-filter-mobile above
           takes its place there instead.
           ========================================================= -->
      <div class="tx-filter-group">
        <label for="tx-filter-account" class="sr-only">Filter by account</label>
        <select id="tx-filter-account">
          <option value="all" selected>All accounts</option>
        </select>

        <label for="tx-filter-type" class="sr-only">Filter by type</label>
        <select id="tx-filter-type">
          <option value="all" selected>All types</option>
          <option value="transfer">Transfers</option>
          <option value="card">Card payments</option>
          <option value="deposit">Deposits</option>
          <option value="withdrawal">Withdrawals</option>
          <option value="fee">Fees</option>
        </select>

        <label for="tx-filter-status" class="sr-only">Filter by status</label>
        <select id="tx-filter-status">
          <option value="all" selected>All statuses</option>
          <option value="Completed">Completed</option>
          <option value="Processing">Processing</option>
          <option value="Pending">Pending</option>
          <option value="Failed">Failed</option>
        </select>

        <label for="tx-filter-currency" class="sr-only">Filter by currency</label>
        <select id="tx-filter-currency">
          <option value="all" selected>All currencies</option>
        </select>

        <label for="tx-filter-from" class="sr-only">From date</label>
        <input type="date" id="tx-filter-from" aria-label="From date">
        <label for="tx-filter-to" class="sr-only">To date</label>
        <input type="date" id="tx-filter-to" aria-label="To date">

        <button type="button" class="btn btn-ghost btn-sm" id="tx-filter-reset">Reset</button>
      </div>
    </div>

    <div class="tx-layout">

      <!-- =========================================================
           TRANSACTION LIST
           ========================================================= -->
      <div class="profile-card tx-list-wrap">

        <div id="tx-list-body">
          <!-- skeleton rows shown until first load resolves -->
          <div class="tx-day-group" data-skeleton>
            <div class="tx-day-heading skeleton" style="width:90px;height:14px;"></div>
            <ul class="tx-list">
              <li class="tx-row tx-row--skeleton">
                <span class="tx-icon skeleton"></span>
                <div class="tx-row-main">
                  <strong class="skeleton" style="width:60%;height:14px;display:block;margin-bottom:6px;"></strong>
                  <span class="skeleton" style="width:40%;height:11px;display:block;"></span>
                </div>
                <span class="skeleton" style="width:64px;height:20px;border-radius:999px;"></span>
                <span class="skeleton" style="width:80px;height:20px;border-radius:999px;"></span>
                <span class="skeleton" style="width:70px;height:14px;"></span>
                <span class="skeleton" style="width:50px;height:12px;"></span>
              </li>
              <li class="tx-row tx-row--skeleton">
                <span class="tx-icon skeleton"></span>
                <div class="tx-row-main">
                  <strong class="skeleton" style="width:50%;height:14px;display:block;margin-bottom:6px;"></strong>
                  <span class="skeleton" style="width:35%;height:11px;display:block;"></span>
                </div>
                <span class="skeleton" style="width:64px;height:20px;border-radius:999px;"></span>
                <span class="skeleton" style="width:80px;height:20px;border-radius:999px;"></span>
                <span class="skeleton" style="width:70px;height:14px;"></span>
                <span class="skeleton" style="width:50px;height:12px;"></span>
              </li>
            </ul>
          </div>
        </div>

        <p class="tx-list-count" id="tx-list-count"></p>

        <div class="tx-load-more">
          <button type="button" class="btn btn-ghost" id="tx-load-more-btn" hidden>Load more transactions</button>
        </div>
      </div>

      <!-- =========================================================
           TRANSACTION DETAIL PANEL
           ========================================================= -->
      <aside class="profile-card tx-detail-panel" id="tx-detail-panel" aria-label="Transaction detail">
        <button type="button" class="modal-close tx-detail-close" id="tx-detail-close" aria-label="Close transaction detail">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div id="tx-detail-content" class="tx-detail-empty">
          <p>Select a transaction to see the full details here.</p>
        </div>
      </aside>

    </div>
  </div>
</main>

<div class="tx-detail-scrim" id="tx-detail-scrim" hidden></div>

<div class="toast-stack" id="toast-stack"></div>

<script type="module">
  import { loadComponents } from '../components/components.js';
  loadComponents();
</script>
<script type="module" src="../assets/js/auth-ui.js"></script>
<script src="../assets/js/main.js"></script>
<script type="module" src="transactions.js"></script>
</body>
</html>
